name: Build DriveAssistant IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Unit Tests
        run: |
          SIM_UDID=$(xcrun simctl list devices available iPhone | grep -m 1 -oE '[0-9A-F-]{36}')
          DESTINATION=${SIM_UDID:+"platform=iOS Simulator,id=$SIM_UDID"}
          DESTINATION=${DESTINATION:-"platform=iOS Simulator,name=iPhone 17"}
          xcodebuild test -project DriveAssistant.xcodeproj \
            -scheme DriveAssistant \
            -destination "$DESTINATION" \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Publish Code Coverage Report
        if: always()
        run: |
          echo "## Xcode Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          xcrun xccov view --report --only-targets build/TestResults.xcresult >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          xcrun xccov view --report --files-for-target DriveAssistant.app build/TestResults.xcresult >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Release App (Unsigned)
        run: |
          xcodebuild -project DriveAssistant.xcodeproj \
            -scheme DriveAssistant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DriveAssistant.app Payload/
          zip -r DriveAssistant-Release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveAssistant-Release-IPA
          path: DriveAssistant-Release.ipa
          retention-days: 7